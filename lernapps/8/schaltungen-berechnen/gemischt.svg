<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img"><title>Gemischte Schaltung: Spannungsquelle mit 12 V, dahinter R1 = 20 Ohm in Reihe zu den parallelen Widerständen R2 = 30 Ohm und R3 = 60 Ohm.</title><rect width="560" height="220" rx="10" fill="#f1f4f8"/><g fill="none" stroke="#1a2436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><line x1="44" y1="50" x2="123" y2="50"/><rect x="123" y="39" width="54" height="22" fill="#f1f4f8"/><text x="150" y="32" text-anchor="middle" font-size="15" fill="#1a2436" stroke="none">R₁ = 20 Ω</text><line x1="177" y1="50" x2="420" y2="50"/><line x1="44" y1="170" x2="420" y2="170"/><line x1="300" y1="50" x2="300" y2="83"/><rect x="289" y="83" width="22" height="54" fill="#f1f4f8"/><text x="324" y="115" text-anchor="start" font-size="15" fill="#1a2436" stroke="none">R₂ = 30 Ω</text><line x1="300" y1="137" x2="300" y2="170"/><circle cx="300" cy="50" r="3.5" fill="#1a2436"/><circle cx="300" cy="170" r="3.5" fill="#1a2436"/><line x1="420" y1="50" x2="420" y2="83"/><rect x="409" y="83" width="22" height="54" fill="#f1f4f8"/><text x="444" y="115" text-anchor="start" font-size="15" fill="#1a2436" stroke="none">R₃ = 60 Ω</text><line x1="420" y1="137" x2="420" y2="170"/><line x1="44" y1="50" x2="44" y2="100"/><line x1="44" y1="120" x2="44" y2="170"/><line x1="30" y1="100" x2="58" y2="100"/><line x1="36" y1="120" x2="52" y2="120" stroke-width="5"/><text x="18" y="105" text-anchor="end" font-size="15" fill="#1a2436" stroke="none">+</text><text x="70" y="115" text-anchor="start" font-size="15" fill="#1a2436" stroke="none">U = 12 V</text><path d="M88 44L102 50L88 56Z" fill="#1a2436"/></g></svg>