<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img"><title>Reihenschaltung: Spannungsquelle mit 9 V, dahinter in Reihe R1 = 10 Ohm, R2 = 20 Ohm und R3 = 30 Ohm.</title><rect width="480" height="220" rx="10" fill="#f1f4f8"/><g fill="none" stroke="#1a2436" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" font-family="sans-serif"><line x1="44" y1="50" x2="116" y2="50"/><rect x="116" y="39" width="54" height="22" fill="#f1f4f8"/><text x="143" y="32" text-anchor="middle" font-size="15" fill="#1a2436" stroke="none">R₁ = 10 Ω</text><line x1="170" y1="50" x2="215" y2="50"/><rect x="215" y="39" width="54" height="22" fill="#f1f4f8"/><text x="242" y="32" text-anchor="middle" font-size="15" fill="#1a2436" stroke="none">R₂ = 20 Ω</text><line x1="269" y1="50" x2="314" y2="50"/><rect x="314" y="39" width="54" height="22" fill="#f1f4f8"/><text x="341" y="32" text-anchor="middle" font-size="15" fill="#1a2436" stroke="none">R₃ = 30 Ω</text><line x1="368" y1="50" x2="440" y2="50"/><line x1="44" y1="170" x2="440" y2="170"/><line x1="440" y1="50" x2="440" y2="170"/><line x1="44" y1="50" x2="44" y2="100"/><line x1="44" y1="120" x2="44" y2="170"/><line x1="30" y1="100" x2="58" y2="100"/><line x1="36" y1="120" x2="52" y2="120" stroke-width="5"/><text x="18" y="105" text-anchor="end" font-size="15" fill="#1a2436" stroke="none">+</text><text x="70" y="115" text-anchor="start" font-size="15" fill="#1a2436" stroke="none">U = 9 V</text><path d="M88 44L102 50L88 56Z" fill="#1a2436"/></g></svg>